<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Listagem - Aplicacao Exemplo</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  ul#lista-itens { padding-left: 20px; }

</head>
<body>
  <h1>Listagem</h1>
  <p>Bem-vindo, <span id="usuario-logado">{{USERNAME}}</span></p>

    {{ITEMS}}
  </ul>
</body>
</html>
